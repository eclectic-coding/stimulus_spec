version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      # Daily, to match the daily scheduled audit: a weekly cadence left new
      # advisories failing the audit for days before a fix PR appeared.
      interval: daily
    # Also bump transitive dependencies (rack, nokogiri, addressable, ...).
    # By default Dependabot only updates gems listed in the Gemfile/gemspec,
    # which let patched-but-locked indirect gems fail the audit.
    allow:
      - dependency-type: all
    # One PR per run for all minor/patch bumps (auto-merged once CI passes); majors stay separate PRs.
    groups:
      bundler-minor-patch:
        patterns:
        - "*"
        update-types:
        - minor
        - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
